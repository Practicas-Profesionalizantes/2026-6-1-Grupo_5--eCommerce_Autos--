spring.application.name=carfind
# Core DataSource Setup
# En local usa XAMPP (puerto 3307). En la nube se configuran las variables DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/compraventa}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Puerto del servidor: los servicios en la nube lo indican con la variable PORT
server.port=${PORT:8080}

# Los errores llegan al frontend como JSON { message }
server.error.include-message=always

# Fotos subidas desde el frontend (publicaciones, perfil y chat). Se guardan en la tabla archivos
# y se sirven en /uploads/**
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
